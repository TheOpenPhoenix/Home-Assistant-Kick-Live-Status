name: Build and release add-on

on:
  push:
    branches: [main]
    paths:
      - "kick_live_status/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "kick_live_status/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and re-push images even if this version is already released (does not touch the release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      slug: ${{ steps.meta.outputs.slug }}
      release_needed: ${{ steps.meta.outputs.release_needed }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read version and look for an existing release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' kick_live_status/config.yaml)
          slug=$(sed -n 's/^slug: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' kick_live_status/config.yaml)
          if [ -z "$version" ] || [ -z "$slug" ]; then
            echo "Could not read version/slug from config.yaml" >&2
            exit 1
          fi

          release_needed=false
          publish=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release v$version already exists; nothing to publish."
            else
              echo "No release for v$version yet; it will be built and released."
              release_needed=true
              publish=true
            fi
            if [ "$FORCE" = "true" ]; then
              publish=true
            fi
          fi

          {
            echo "version=$version"
            echo "slug=$slug"
            echo "release_needed=$release_needed"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: github.event_name == 'pull_request' || needs.check.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SLUG: ${{ needs.check.outputs.slug }}
      PUBLISH: ${{ needs.check.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Work out image name
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/${{ matrix.arch }}-addon-$SLUG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: kick_live_status
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  release:
    name: Create release
    needs: [check, build]
    if: needs.check.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Extract this version's changelog entry
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 == "## " v { found = 1; next }
            /^## /        { if (found) exit }
            found
          ' kick_live_status/CHANGELOG.md | sed -e :a -e '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create tag and GitHub Release
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --latest
