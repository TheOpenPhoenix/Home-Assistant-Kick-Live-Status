name: Build and publish add-on images

# Builds the add-on image for each supported architecture and publishes it to
# GHCR. Supervisor pulls `image:` from kick_live_status/config.yaml, tagged with
# the add-on `version`, so a release is a version bump merged to main.
on:
  push:
    branches: [main]
    paths:
      - "kick_live_status/**"
      - ".github/workflows/build.yaml"
  pull_request:
    paths:
      - "kick_live_status/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read add-on version and slug
        id: meta
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' kick_live_status/config.yaml)
          slug=$(sed -n 's/^slug: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' kick_live_status/config.yaml)
          if [ -z "$version" ] || [ -z "$slug" ]; then
            echo "Could not read version/slug from config.yaml" >&2
            exit 1
          fi
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/${{ matrix.arch }}-addon-$slug" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: kick_live_status
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
